# jptxt notepad — https://whatamieatingtoday.com/app/jptxt/
location = /app/jptxt { return 301 /app/jptxt/; }
location /app/jptxt/ {
    alias /var/www/apps/jptxt/;
    index index.html;
    types {
        text/html html htm;
        text/plain ps1 sh txt md;
        application/octet-stream exe;
    }
    default_type application/octet-stream;
    add_header X-Robots-Tag "noindex" always;
}
